services:
  api:
    build: ../../api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql
      - ../../db:/docker-entrypoint-initdb.d:ro

volumes:
  db-data:
