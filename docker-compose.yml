services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@db/recipes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:  # demo only: use .env or Docker secrets in production
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=recipes
    volumes:
      - db-data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 5

  smoke-test:
    image: curlimages/curl
    command: ["-fsS", "--retry", "10", "--retry-delay", "1", "--retry-all-errors", "http://api:8000/recipes"]
    depends_on:
      - api
    profiles: [test]

volumes:
  db-data:
